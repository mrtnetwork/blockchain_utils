name: Dart

# All four backends: pure Dart (VM + browser), Rust FFI (VM),
# Rust WASM (browser). The Rust crate is checked out from
# mrtnetwork/blockchain-utils ($BU_RUST_CRATE); the connector comes from
# its git dependency (https://github.com/mrtnetwork/blockchain_utils_connector).
on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  BU_RUST_CRATE: ${{ github.workspace }}/rust-crate

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart-vm:
    name: Dart backend (VM)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BU_BACKEND: dart
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: dart pub get --no-example

      - name: Analyze
        run: dart analyze

      - name: Run tests (pure Dart)
        run: dart test

  ffi-vm:
    name: Rust FFI backend (VM)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BU_BACKEND: ffi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Rust crate
        uses: actions/checkout@v4
        with:
          repository: mrtnetwork/blockchain-utils
          path: rust-crate

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust-crate -> target"

      - name: Install dependencies
        run: dart pub get --no-example

      - name: Analyze
        run: dart analyze

      - name: Build FFI backend
        run: dart tool/build_backends.dart --ffi

      - name: Run tests (FFI)
        run: dart test

  dart-web:
    name: Dart backend (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: dart pub get --no-example

      - name: Chrome wrapper (no-sandbox)
        run: |
          printf '#!/bin/sh\nexec /usr/bin/google-chrome --no-sandbox "$@"\n' \
            > /tmp/chrome-nosandbox.sh
          chmod +x /tmp/chrome-nosandbox.sh

      - name: Run browser tests (pure Dart)
        env:
          CHROME_EXECUTABLE: /tmp/chrome-nosandbox.sh
        run: >
          dart test -p chrome test/one_shot_browser_dart_test.dart
          --timeout=20m

  dart-web-wasm-suite:
    name: Dart backend (browser, dart2wasm, portable word math)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: dart pub get --no-example

      - name: Chrome wrapper (no-sandbox)
        run: |
          printf '#!/bin/sh\nexec /usr/bin/google-chrome --no-sandbox "$@"\n' \
            > /tmp/chrome-nosandbox.sh
          chmod +x /tmp/chrome-nosandbox.sh

      - name: Run browser tests (pure Dart, dart2wasm)
        env:
          CHROME_EXECUTABLE: /tmp/chrome-nosandbox.sh
        run: >
          dart test -p chrome -c dart2wasm test/one_shot_browser_dart_test.dart
          --timeout=20m

  dart-web-wasm:
    name: Dart backend (browser, dart2wasm + native word math)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: dart pub get --no-example

      - name: Compile word-math check (native 64-bit math on)
        run: |
          mkdir -p /tmp/wasm-math
          dart compile wasm tool/check_wasm_word_math.dart \
            -o /tmp/wasm-math/check.wasm \
            --define=BLOCKCHAIN_UTILS_NATIVE_MATH=true
          cp tool/check_wasm_word_math.html /tmp/wasm-math/check.html

      - name: Chrome wrapper (no-sandbox)
        run: |
          printf '#!/bin/sh\nexec /usr/bin/google-chrome --no-sandbox "$@"\n' \
            > /tmp/chrome-nosandbox.sh
          chmod +x /tmp/chrome-nosandbox.sh

      - name: Run word-math check in headless Chrome
        # Expects `WASM-WORD-MATH-OK` in the dumped DOM. Anything else —
        # including a missing marker (load/init failure) — fails the job.
        run: |
          (python3 -m http.server 8931 --directory /tmp/wasm-math >/dev/null 2>&1 &)
          for i in 1 2 3 4 5 6 7 8; do
            OUT=$(google-chrome --headless=new --no-sandbox --disable-gpu \
              --virtual-time-budget=60000 --dump-dom \
              http://127.0.0.1:8931/check.html 2>/dev/null \
              | grep -o '<body>[^<]*' || true)
            echo "attempt $i: $OUT"
            case "$OUT" in
              *WASM-WORD-MATH-OK*) exit 0 ;;
              *WASM-WORD-MATH-FAIL*) echo "$OUT"; exit 1 ;;
            esac
            sleep 3
          done
          echo 'word-math check never completed'; exit 1

  wasm-web:
    name: Rust WASM backend (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Rust crate
        uses: actions/checkout@v4
        with:
          repository: mrtnetwork/blockchain-utils
          path: rust-crate

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Setup Rust (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust-crate -> target"

      - name: Install wasm-bindgen-cli (pinned to Cargo.toml)
        run: |
          BIN="${CARGO_HOME:-$HOME/.cargo}/bin/wasm-bindgen"
          if [ -x "$BIN" ]; then "$BIN" --version; exit 0; fi
          VER=$(sed -n 's/^wasm-bindgen = { version = "=\([0-9.]*\)".*/\1/p' "$BU_RUST_CRATE/Cargo.toml" | head -n 1)
          if [ -z "$VER" ]; then
            echo "cannot parse wasm-bindgen version from Cargo.toml"
            exit 1
          fi
          cargo install wasm-bindgen-cli --version "$VER" --locked

      - name: Install dependencies
        run: dart pub get --no-example

      - name: Build WASM assets into test/wasm_assets
        # --force: always rebuild from the checked-out sources (never trust
        # possibly-committed test/wasm_assets), then run the browser suites
        # against that fresh build.
        run: dart tool/build_backends.dart --wasm --force

      - name: Chrome wrapper (no-sandbox)
        run: |
          printf '#!/bin/sh\nexec /usr/bin/google-chrome --no-sandbox "$@"\n' \
            > /tmp/chrome-nosandbox.sh
          chmod +x /tmp/chrome-nosandbox.sh

      - name: Run browser tests (WASM)
        env:
          CHROME_EXECUTABLE: /tmp/chrome-nosandbox.sh
        run: >
          dart test -p chrome test/browser_wasm_test.dart
          test/one_shot_browser_wasm_test.dart --timeout=20m
